<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="darkreader-lock" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mokai</title>
        <link rel="icon" href="/Mokai.png" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Mokai</h1>
            <form id="download-form">
                <div class="form-group">
                    <label for="url">📎 Video URL:</label>
                    <input
                        type="text"
                        id="url"
                        name="url"
                        placeholder="Paste YouTube/video URL here..."
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="format">🎵 Format:</label>
                    <select id="format" name="format">
                        <option value="mp4">🎥 MP4 (Video)</option>
                        <option value="mp3">🎵 MP3 (Audio Only)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="custom-path"
                        >📁 Download Directory (Optional):</label
                    >
                    <input
                        type="text"
                        id="custom-path"
                        name="custom-path"
                        placeholder="Leave empty for default (./music)"
                    />
                    <div class="path-hint">
                        By default, files will be downloaded to your current
                        directory.
                    </div>
                </div>
                <button type="submit" class="download-btn">⬇️ Download</button>
            </form>
        </div>

        <!-- Progress Modal Overlay Screen -->
        <div id="popup" class="modal-overlay hidden">
            <div id="popup-content" class="modal-card">
                <div class="loader"></div>
                <p id="progress-text">Starting download...</p>
                <div class="progress-container">
                    <progress id="progress-bar" value="0" max="100"></progress>
                </div>
                <div id="progress-details" class="progress-details"></div>
            </div>
        </div>

        <script>
            const downloadForm = document.getElementById("download-form");
            const popup = document.getElementById("popup");

            const progressBar = document.getElementById("progress-bar");
            const progressText = document.getElementById("progress-text");
            const progressDetails = document.getElementById("progress-details");
            const urlInput = document.getElementById("url");

            // Utility to handle modal toggle visibility states safely
            function toggleModal(modal, show) {
                if (show) {
                    modal.classList.remove("hidden");
                    modal.style.display = "flex";
                } else {
                    modal.style.display = "none";
                    modal.classList.add("hidden");
                }
            }

            // Active Downloader Pipeline
            downloadForm.addEventListener("submit", (e) => {
                e.preventDefault();

                const url = urlInput.value.trim();
                const format = document.getElementById("format").value;
                const customPath = document
                    .getElementById("custom-path")
                    .value.trim();
                const downloadId =
                    Math.random().toString(36).substr(2, 9) +
                    Date.now().toString(36);

                // Prepare interactive UI status elements
                toggleModal(popup, true);
                progressText.textContent = "Starting download...";
                progressText.className = "";
                progressBar.value = 0;
                progressDetails.textContent = "";

                // Dispatch Payload Execution Requests
                fetch("/download", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        url: url,
                        format: format,
                        download_id: downloadId,
                        custom_path: customPath || null,
                    }),
                }).catch((err) => {
                    console.error("Download request failed:", err);
                    progressText.textContent = "Failed to start download";
                    progressText.className = "error";
                    setTimeout(() => toggleModal(popup, false), 3000);
                });

                // Long-Polling Dynamic Progress Status Loop
                let finished = false;
                const interval = setInterval(() => {
                    fetch(`/progress?download_id=${downloadId}`)
                        .then((r) => r.json())
                        .then((data) => {
                            progressBar.value = data.progress || 0;

                            switch (data.status) {
                                case "starting":
                                    progressText.textContent =
                                        "Initializing...";
                                    break;
                                case "extracting":
                                    progressText.textContent =
                                        "Extracting video information...";
                                    break;
                                case "downloading":
                                    progressText.textContent =
                                        data.message || "Downloading...";
                                    progressDetails.textContent = `Progress: ${Math.round(data.progress)}%`;
                                    break;
                                case "downloading_multiple":
                                    progressText.textContent =
                                        data.message ||
                                        "Downloading playlist...";
                                    progressDetails.textContent =
                                        data.total_items > 1
                                            ? `Item ${data.current_item} of ${data.total_items} • ${Math.round(data.progress)}%`
                                            : `Progress: ${Math.round(data.progress)}%`;
                                    break;
                                case "finished":
                                    progressText.textContent =
                                        data.message ||
                                        "Download completed! ✅";
                                    progressText.className = "success";
                                    progressDetails.textContent =
                                        "100% Complete";

                                    if (!finished) {
                                        finished = true;
                                        clearInterval(interval);
                                        setTimeout(() => {
                                            toggleModal(popup, false);
                                            urlInput.value = "";
                                        }, 3000);
                                    }
                                    break;
                                case "error":
                                    progressText.textContent =
                                        "Error: " +
                                        (data.message ||
                                            "Unknown error occurred");
                                    progressText.className = "error";
                                    progressDetails.textContent = "";

                                    clearInterval(interval);
                                    setTimeout(
                                        () => toggleModal(popup, false),
                                        4000,
                                    );
                                    break;
                            }
                        })
                        .catch((err) => {
                            console.error("Progress check failed:", err);
                            if (!finished) {
                                progressText.textContent = "Connection error";
                                progressText.className = "error";
                                clearInterval(interval);
                                setTimeout(
                                    () => toggleModal(popup, false),
                                    3000,
                                );
                            }
                        });
                }, 500);
            });
        </script>
    </body>
</html>
