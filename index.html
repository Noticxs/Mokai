<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="darkreader-lock" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mokai</title>
        <link rel="icon" href="/Mokai.png" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Mokai</h1>
            <form id="download-form">
                <div class="form-group">
                    <label for="url">📎 Video URL:</label>
                    <input
                        type="text"
                        id="url"
                        name="url"
                        placeholder="Paste YouTube/video URL here..."
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="format">🎵 Format:</label>
                    <select id="format" name="format">
                        <option value="mp4">🎥 MP4 (Video)</option>
                        <option value="mp3">🎵 MP3 (Audio Only)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="custom-path"
                        >📁 Download Directory (Optional):</label
                    >
                    <input
                        type="text"
                        id="custom-path"
                        name="custom-path"
                        placeholder="Leave empty for default (./music)"
                    />
                    <div class="path-hint">
                        Examples: /Users/username/Downloads, C:\\Downloads,
                        ./my_videos
                    </div>
                </div>
                <button type="submit" class="download-btn">⬇️ Download</button>
            </form>
        </div>

        <!-- Floating Action Trigger Button -->
        <button
            id="history-toggle-button"
            class="floating-action-button"
            title="View Download History"
        >
            📜
        </button>

        <!-- FIXED: Progress Modal Overlay Screen now hidden by default -->
        <div id="popup" class="modal-overlay hidden">
            <div id="popup-content" class="modal-card">
                <div class="loader"></div>
                <p id="progress-text">Starting download...</p>
                <div class="progress-container">
                    <progress id="progress-bar" value="0" max="100"></progress>
                </div>
                <div id="progress-details" class="progress-details"></div>
            </div>
        </div>

        <!-- Screen-Takeover History Panel Modal Overlay Container -->
        <div id="history-panel" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h2>Download History</h2>
                    <button
                        id="history-close-button"
                        class="close-btn"
                        title="Close Panel"
                    >
                        ✕
                    </button>
                </div>
                <ul id="history-list">
                    <!-- Sample items injected dynamically will look like this: -->
                    <!-- <li><span class="history-url">https://youtube.com/watch?v=...</span><span class="success">Completed</span></li> -->
                </ul>
                <button id="clear-history" class="clear-history">
                    Clear History
                </button>
            </div>
        </div>

        <script>
            // Elements
            const historyPanel = document.getElementById("history-panel");
            const historyToggle = document.getElementById(
                "history-toggle-button",
            );
            const historyClose = document.getElementById(
                "history-close-button",
            );
            const clearHistory = document.getElementById("clear-history");
            const historyList = document.getElementById("history-list");
            const downloadForm = document.getElementById("download-form");
            const popup = document.getElementById("popup");

            // Open/Toggle History Modal Screen
            historyToggle.onclick = function () {
                historyPanel.classList.remove("hidden");
            };

            // Close History Modal Screen via 'X'
            historyClose.onclick = function () {
                historyPanel.classList.add("hidden");
            };

            // Close History or Progress if clicking dark background space outside cards
            window.onclick = function (e) {
                if (e.target === historyPanel) {
                    historyPanel.classList.add("hidden");
                }
            };

            // Clear Dynamic Inner Lists
            clearHistory.onclick = function () {
                historyList.innerHTML =
                    '<li class="empty-history-msg">No downloads logged yet.</li>';
            };

            // Form Submit Routine
            downloadForm.onsubmit = function (e) {
                e.preventDefault();

                const url = document.getElementById("url").value.trim();
                const format = document.getElementById("format").value;
                const customPath = document
                    .getElementById("custom-path")
                    .value.trim();
                const downloadId =
                    Math.random().toString(36).substr(2, 9) +
                    Date.now().toString(36);

                // Open active tracking modal overlay display state
                popup.classList.remove("hidden"); // Clean class toggle support
                popup.style.display = "flex";
                document.getElementById("progress-text").textContent =
                    "Starting download...";
                document.getElementById("progress-text").className = "";
                document.getElementById("progress-bar").value = 0;
                document.getElementById("progress-details").textContent = "";

                // Push item entry to internal history log
                const newLog = document.createElement("li");
                newLog.innerHTML = `<span class="history-url">${url}</span><span class="status-indicator processing">Downloading...</span>`;

                // Remove placeholder if present
                const emptyMsg =
                    historyList.querySelector(".empty-history-msg");
                if (emptyMsg) emptyMsg.remove();
                historyList.prepend(newLog);

                fetch("/download", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        url: url,
                        format: format,
                        download_id: downloadId,
                        custom_path: customPath || null,
                    }),
                }).catch((err) => {
                    console.error("Download request failed:", err);
                    document.getElementById("progress-text").textContent =
                        "Failed to start download";
                    document.getElementById("progress-text").className =
                        "error";
                    newLog.querySelector(".status-indicator").className =
                        "status-indicator error";
                    newLog.querySelector(".status-indicator").textContent =
                        "Failed";
                    setTimeout(() => {
                        popup.style.display = "none";
                        popup.classList.add("hidden");
                    }, 3000);
                });

                let finished = false;
                const interval = setInterval(() => {
                    fetch("/progress?download_id=" + downloadId)
                        .then((r) => r.json())
                        .then((data) => {
                            const progressBar =
                                document.getElementById("progress-bar");
                            const progressText =
                                document.getElementById("progress-text");
                            const progressDetails =
                                document.getElementById("progress-details");
                            const statusBadge =
                                newLog.querySelector(".status-indicator");

                            progressBar.value = data.progress || 0;

                            if (data.status === "starting") {
                                progressText.textContent = "Initializing...";
                            } else if (data.status === "extracting") {
                                progressText.textContent =
                                    "Extracting video information...";
                            } else if (data.status === "downloading") {
                                progressText.textContent =
                                    data.message || "Downloading...";
                                progressDetails.textContent = `Progress: ${Math.round(data.progress)}%`;
                            } else if (data.status === "downloading_multiple") {
                                progressText.textContent =
                                    data.message || "Downloading playlist...";
                                progressDetails.textContent =
                                    data.total_items > 1
                                        ? `Item ${data.current_item} of ${data.total_items} • ${Math.round(data.progress)}%`
                                        : `Progress: ${Math.round(data.progress)}%`;
                            } else if (data.status === "finished") {
                                progressText.textContent =
                                    data.message || "Download completed! ✅";
                                progressText.className = "success";
                                progressDetails.textContent = "100% Complete";

                                if (statusBadge) {
                                    statusBadge.className =
                                        "status-indicator success";
                                    statusBadge.textContent = "Completed";
                                }

                                if (!finished) {
                                    finished = true;
                                    setTimeout(() => {
                                        popup.style.display = "none";
                                        popup.classList.add("hidden");
                                        document.getElementById("url").value =
                                            "";
                                    }, 3000);
                                    clearInterval(interval);
                                }
                            } else if (data.status === "error") {
                                progressText.textContent =
                                    "Error: " +
                                    (data.message || "Unknown error occurred");
                                progressText.className = "error";
                                progressDetails.textContent = "";

                                if (statusBadge) {
                                    statusBadge.className =
                                        "status-indicator error";
                                    statusBadge.textContent = "Error";
                                }

                                setTimeout(() => {
                                    popup.style.display = "none";
                                    popup.classList.add("hidden");
                                }, 4000);
                                clearInterval(interval);
                            }
                        })
                        .catch((err) => {
                            console.error("Progress check failed:", err);
                            if (!finished) {
                                document.getElementById(
                                    "progress-text",
                                ).textContent = "Connection error";
                                document.getElementById(
                                    "progress-text",
                                ).className = "error";
                                setTimeout(() => {
                                    popup.style.display = "none";
                                    popup.classList.add("hidden");
                                }, 3000);
                                clearInterval(interval);
                            }
                        });
                }, 500);
            };
        </script>
    </body>
</html>
